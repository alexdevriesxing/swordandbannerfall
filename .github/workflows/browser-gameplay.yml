name: Full Chromium gameplay and replay QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game dependencies
        run: npm install --no-audit --no-fund
      - name: Hard gate — all final production artwork and approved rights required
        run: npm run check:release
      - name: Validate complete combat model
        run: npm test
      - name: Build actual Phaser browser bundle
        run: npm run build
      - name: Install browser QA runner
        run: npm install --no-save playwright@1.55.0 --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production preview on loopback
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/sword-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sword-vite.log
          exit 1
      - name: Verify real 10v10 controls, elimination victory and replay
        run: node scripts/browser-smoke.mjs
      - name: Preserve actual browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-citadel-browser-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
