name: Verify combat model and build
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies without downloading unused Linux Electron
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Test safe v2 candidate archive handling (no asset installation)
        run: python3 -m unittest discover -s tests -p 'test_stage_art_v2_zip.py' -v
      - name: Syntax-check browser acceptance and desktop entrypoints
        run: |
          node --check scripts/browser-smoke.mjs
          node --check scripts/browser-local-2p-smoke.mjs
          node --check scripts/browser-demo-smoke.mjs
          node --check desktop/main.cjs
      - run: npm run build
      - name: Build separated time-limited HTML5 demo
        run: npm run build:demo
      - name: Verify local file-safe bundle for Windows packaging
        run: npm run check:offline-bundle
      - name: Check production-art readiness (informational until final assets approved)
        run: npm run check:assets
        continue-on-error: true
