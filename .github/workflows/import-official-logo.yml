name: Import verified Fire Dragon studio logo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-official-logo.yml'
      - 'scripts/import-official-branding.js'
permissions:
  contents: write
jobs:
  import-official-logo:
    if: github.repository == 'alexdevriesxing/swordandbannerfall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and cryptographically verify the exact first-party logo
        run: npm run assets:import-branding
      - name: Commit approved-source image bytes without changing licensing approvals
        run: |
          git add public/assets/branding/fire-dragon-interactive.png
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import original Fire Dragon branding from pinned studio Git blob'
            git push origin HEAD:main
          else
            echo 'Original logo is already committed.'
          fi
